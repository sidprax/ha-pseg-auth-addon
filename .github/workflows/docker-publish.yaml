name: Build and Publish Add-on Images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*", "*.*.*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-ha-addons:
    name: Build & Push HA Add-on (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract add-on version
        id: version
        run: |
          VERSION=$(grep '^version:' pseg_auth/config.yaml | awk '{print $2}' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push HA Add-on image
        uses: docker/build-push-action@v6
        with:
          context: ./pseg_auth
          file: ./pseg_auth/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ha-pseg-auth-${{ matrix.arch }}:latest
            ghcr.io/${{ github.repository_owner }}/ha-pseg-auth-${{ matrix.arch }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-standalone:
    name: Build & Push Multi-Arch Standalone Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract add-on version
        id: version
        run: |
          VERSION=$(grep '^version:' pseg_auth/config.yaml | awk '{print $2}' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Standalone image
        uses: docker/build-push-action@v6
        with:
          context: ./pseg_auth
          file: ./pseg_auth/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ha-pseg-auth:latest
            ghcr.io/${{ github.repository_owner }}/ha-pseg-auth:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
